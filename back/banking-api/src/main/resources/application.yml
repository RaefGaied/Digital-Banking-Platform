spring:
  application:
    name: banking-api

  datasource:
    url: jdbc:postgresql://localhost:5432/banking_db
    username: banking_user
    password: banking_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: banking-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fintech.banking.*

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  ai:
    mcp:
      server:
        protocol: streamable
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

server:
  port: 8080
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  use-management-port: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:sua-chave-secreta-super-segura-aqui-minimo-256-bits-para-hs256}
  expiration: 900000
  refresh-expiration: 604800000

app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@finbank.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  sensitive-line:
    threshold: 5000

rag:
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.72}

logging:
  level:
    com.fintech.banking: DEBUG
    org.springframework.security: INFO
    org.springframework.security.web.authentication.Http403ForbiddenEntryPoint: INFO

azure:
  client-id: ${AZURE_CLIENT_ID:}
  client-secret: ${AZURE_CLIENT_SECRET:}
  tenant-id: ${AZURE_TENANT_ID:}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:}
    api-version: ${AZURE_OPENAI_API_VERSION:2024-06-01}
    api-key: ${AZURE_OPENAI_API_KEY:}
    model: ${AZURE_OPENAI_MODEL:gpt-4o}

ai:
  ollama:
    enabled: ${OLLAMA_ENABLED:false}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: full
  process-definition-location-prefix: classpath:/processes/
  process-definition-location-suffix: '**.bpmn'
