services:
  postgres:
    image: ghcr.io/raefgaied/digital-banking-platform-postgres:${IMAGE_TAG:-latest}
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: banking-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - banking-network

  ollama:
    image: ollama/ollama:latest
    container_name: banking-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-model:
    image: ollama/ollama:latest
    container_name: banking-ollama-model
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1 ||
        ollama pull "$${OLLAMA_MODEL}";
        ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 ||
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - banking-network
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: banking-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: banking-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    command: >
      bash -ec "echo 'delete /brokers/ids/1' | zookeeper-shell zookeeper:2181 >/dev/null 2>&1 || true;
      /etc/confluent/docker/run"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    image: ghcr.io/raefgaied/digital-banking-platform-banking-api:${IMAGE_TAG:-latest}
    build:
      context: ./back/banking-api
      dockerfile: Dockerfile
    container_name: banking-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_db
      SPRING_DATASOURCE_USERNAME: banking_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banking_pass}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-in-production}
      AI_AGENT_ENABLED: 'true'
      AI_AGENT_BASE_URL: http://ai-agent:8001
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED_ENUM_JDBC_TYPE: VARCHAR
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@finbank.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-agent:
    image: ghcr.io/raefgaied/digital-banking-platform-ai-agent:${IMAGE_TAG:-latest}
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: banking-ai-agent
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-in-production}
      BASE_URL: http://backend:8080/api/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      MEMORY_FILE: /app/data/memory.json
      MEMORY_MAX_HISTORY: ${MEMORY_MAX_HISTORY:-0}
    depends_on:
      backend:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    volumes:
      - agent_memory:/app/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/raefgaied/digital-banking-platform-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: banking-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - banking-network

  pgadmin:
    image: ghcr.io/raefgaied/digital-banking-platform-pgadmin:${IMAGE_TAG:-latest}
    build:
      context: ./docker/pgadmin
      dockerfile: Dockerfile
    container_name: banking-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@banking.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      PGPASS_FILE: /pgadmin4/pgpass
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - banking-network

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  agent_memory:

networks:
  banking-network:
    driver: bridge
