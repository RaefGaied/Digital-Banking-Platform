name: SonarQube Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build backend
        working-directory: back/banking-api
        run: mvn -B -DskipTests package

      - name: Run SonarQube scan
        working-directory: back/banking-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is required" >&2
            exit 1
          fi
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.6.0.6792:sonar \
            -Dsonar.projectKey=RaefGaied_Digital-Banking-Platform-main \
            -Dsonar.organization=raefgaied \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN"
