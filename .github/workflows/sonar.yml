name: SonarQube Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build backend
        working-directory: back/banking-api
        run: mvn -B -DskipTests package

      - name: Run SonarQube scan
        working-directory: back/banking-api
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: github-actions
        run: |
          sonarArgs=(-Dsonar.token="$SONAR_TOKEN")
          if [ -n "$SONAR_HOST_URL" ]; then
            sonarArgs+=(-Dsonar.host.url="$SONAR_HOST_URL")
          fi
          if [ -n "$SONAR_ORGANIZATION" ]; then
            sonarArgs+=(-Dsonar.organization="$SONAR_ORGANIZATION")
          fi
          mvn -B "${sonarArgs[@]}" org.sonarsource.scanner.maven:sonar-maven-plugin:5.6.0.6792:sonar
